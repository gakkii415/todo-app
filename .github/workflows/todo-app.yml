name: Todoアプリの動作確認

on:
  push:
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/todo-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: 基本動作を確認
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリの内容を取得
        uses: actions/checkout@v4
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 依存関係をインストール
        run: npm ci
      - name: Expoで書き出し可能か確認
        run: npx expo export --platform android --output-dir dist

  android-apk:
    name: Androidアプリをビルド
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリの内容を取得
        uses: actions/checkout@v4
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Javaを準備
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 依存関係をインストール
        run: npm ci
      - name: Android用プロジェクトを生成
        run: npx expo prebuild --platform android --clean
      - name: Androidアプリをビルド
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - name: Androidアプリを保存
        uses: actions/upload-artifact@v4
        with:
          name: todo-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios-simulator:
    name: iPhoneシミュレータで確認
    runs-on: macos-26
    steps:
      - name: リポジトリの内容を取得
        uses: actions/checkout@v4
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 依存関係をインストール
        run: npm ci
      - name: iPhone用プロジェクトを生成
        run: npx expo prebuild --platform ios --clean

      - name: iPhoneシミュレータ用アプリをビルド
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: アプリを起動して画面を撮影
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone Simulator found")
          ')

          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

          APP_PATH=$(find ios-build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UDID" com.gakkii415.todoapp
          sleep 5
          xcrun simctl io "$DEVICE_UDID" screenshot ios-screenshot.png

      - name: iPhoneシミュレータ用アプリを保存
        uses: actions/upload-artifact@v4
        with:
          name: todo-ios-simulator
          path: ios-build/Build/Products/Release-iphonesimulator/*.app

      - name: 画面画像を保存
        uses: actions/upload-artifact@v4
        with:
          name: todo-ios-ui-screenshot
          path: ios-screenshot.png

      - name: 最新の画面画像をリポジトリへ反映
        run: |
          mkdir -p preview
          cp ios-screenshot.png preview/ios.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/ios.png
          if ! git diff --cached --quiet; then
            git commit -m "TodoのiPhone画面プレビューを更新"
            git push
          fi
